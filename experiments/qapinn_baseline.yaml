# QAPINN baseline — hybrid classical->VQC->classical on Burgers.
# This is the exact config used for the first matched-budget comparison
# (results/compare). The four VQC design knobs are the Week-3 ablation axes:
# vary ONE at a time, hold the rest at these baseline values.
name: qapinn_baseline
model: hybrid              # classical pre-net -> VQC -> classical post-net

# --- VQC design knobs (ablation axes) ---
vqc:
  n_qubits: 4
  n_layers: 3               # ansatz / re-upload depth
  reupload: true            # re-encode (x,t)-features each layer
  entanglement: linear      # none | linear | ring | all_to_all
  measurement: multi        # single | multi | zz
  input_scale: 1.0          # encoding angle = input_scale * feature

# --- hybrid architecture around the VQC ---
pre_hidden: [16]            # pre-net: 2 -> 16 -> n_qubits (tanh)
post_hidden: [16]           # post-net: vqc_out -> 16 -> 1

# --- training (reduced scale: quantum sim is ~85x slower than classical) ---
n_interior: 1000
n_ic: 150
n_bc: 150
adam_iters: 2000
adam_lr: 1.0e-2
lbfgs_iters: 0             # L-BFGS closures x ~640ms each are too costly here
seed: 0
log_every: 50
eval_nx: 256
eval_nt: 100
