# Classical Burgers PINN baseline (parameter-matched control for QAPINN).
# Architecture mirrors the standard Raissi et al. (2019) Burgers setup:
# 8 hidden layers x 20, tanh, 10k collocation pts, Adam warmup + L-BFGS polish.
name: burgers_baseline
model: classical
layers: [2, 20, 20, 20, 20, 20, 20, 20, 20, 1]
n_interior: 10000
n_ic: 200
n_bc: 200
adam_iters: 3000
adam_lr: 1.0e-3
lbfgs_iters: 2000
w_pde: 1.0
w_ic: 1.0
w_bc: 1.0
seed: 0
log_every: 100
eval_nx: 256
eval_nt: 100
